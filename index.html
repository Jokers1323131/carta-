<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para la Mejor Mamá 💖</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-pink: #ff85a1;
            --soft-pink: #fbb1bd;
            --dark-pink: #ff477e;
            --glass: rgba(255, 255, 255, 0.25);
            --text-color: #4a4a4a;
        }

        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #fce4ec 0%, #ffebee 100%);
            font-family: 'Poppins', sans-serif;
            overflow: hidden;
        }

        /* Fondo Animado */
        .background-blobs {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            filter: blur(80px);
        }

        .blob {
            position: absolute;
            background: var(--soft-pink);
            border-radius: 50%;
            animation: move 20s infinite alternate;
        }

        @keyframes move {
            from { transform: translate(0, 0); }
            to { transform: translate(100px, 100px); }
        }

        /* Tarjeta Principal */
        .card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 30px;
            padding: 40px;
            width: 90%;
            max-width: 450px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.05);
            animation: fadeIn 1.5s ease-out;
            position: relative;
            z-index: 10;
        }

        h1 {
            font-family: 'Dancing Script', cursive;
            color: var(--dark-pink);
            font-size: 3rem;
            margin-bottom: 10px;
        }

        p {
            color: var(--text-color);
            line-height: 1.6;
            margin-bottom: 30px;
        }

        /* Botón Estilizado */
        .main-btn {
            background: var(--dark-pink);
            color: white;
            border: none;
            padding: 15px 35px;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 20px rgba(255, 71, 126, 0.3);
        }

        .main-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 25px rgba(255, 71, 126, 0.4);
            background: #ff3366;
        }

        /* Mensaje Oculto */
        #hidden-message {
            display: none;
            margin-top: 25px;
            padding: 20px;
            border-top: 1px solid rgba(0,0,0,0.05);
            animation: slideUp 0.8s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Corazones Flotantes */
        .floating-heart {
            position: absolute;
            pointer-events: none;
            animation: floatUp 4s linear forwards;
            opacity: 0.8;
        }

        @keyframes floatUp {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(-100vh) scale(0.5); opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="background-blobs">
        <div class="blob" style="width: 300px; height: 300px; top: 10%; left: 10%;"></div>
        <div class="blob" style="width: 250px; height: 250px; bottom: 10%; right: 10%; background: #ffc2d1;"></div>
    </div>

    <div class="card">
        <h1>Para Mamá</h1>
        <p>Gracias por ser la luz que guía mis días y el amor que nunca falla. Eres el regalo más grande de la vida.</p>
        
        <button class="main-btn" onclick="mostrarSorpresa()">Haz clic aquí ✨</button>

        <div id="hidden-message">
            <h2 style="font-family: 'Dancing Script'; color: var(--dark-pink);">¡Te quiero muchísimo!</h2>
            <p>Espero que hoy y siempre sepas lo especial que eres para mí. Gracias por todo tu esfuerzo y cariño incondicional. 🌸</p>
        </div>
    </div>

    <script>
        function mostrarSorpresa() {
            const mensaje = document.getElementById('hidden-message');
            mensaje.style.display = 'block';
            
            // Lanzar muchos corazones al hacer clic
            for(let i = 0; i < 15; i++) {
                setTimeout(crearCorazon, i * 100);
            }
        }

        function crearCorazon() {
            const heart = document.createElement("div");
            heart.classList.add("floating-heart");
            
            // Variedad de emojis de amor
            const iconos = ["❤️", "💖", "🌸", "💕", "✨"];
            heart.innerText = iconos[Math.floor(Math.random() * iconos.length)];
            
            heart.style.left = Math.random() * 100 + "vw";
            heart.style.top = "100vh";
            heart.style.fontSize = (Math.random() * 20 + 20) + "px";
            
            document.body.appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, 4000);
        }

        // Crear corazones sutiles de fondo cada cierto tiempo
        setInterval(crearCorazon, 1500);

		
    </script>
</body>
</html>
